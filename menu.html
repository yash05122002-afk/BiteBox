<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu | BiteBox</title>
  <link rel="icon" type="image/png" sizes="32x32" href="css/image/favicon/favicon-32x32.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand"><i class="fa-solid fa-burger" style="color: var(--primary);"></i> Bite<span>Box</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html" class="active">Menu</a></li>
        <li><a href="biteDeals.html">Bite Deals</a></li>
        <li><a href="track.html">Track Order</a></li>
      </ul>
      <div class="nav-actions">
        <a href="cart.html" class="cart-btn" aria-label="Cart">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="cart-badge">0</span>
        </a>
        <div id="auth-slot" style="display:flex; align-items:center; gap:10px;">
          <a href="login.html" class="btn btn-outline btn-sm">Login</a>
          <a href="signup.html" class="btn btn-primary btn-sm">Sign Up</a>
        </div>
        <button class="menu-toggle" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </header>

  <section class="page-banner">
    <div class="container">
      <h1>Explore Our Menu</h1>
      <p>Filter by category or search your favorite dish to add it straight to your BiteBox.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="menu-controls">
        <div class="filter-pills">
          <button class="pill active" data-category="all">All</button>
          <button class="pill" data-category="fastfood">Burgers & Pizza</button>
          <button class="pill" data-category="indian">Indian</button>
          <button class="pill" data-category="chinese">Indo-Chinese</button>
          <button class="pill" data-category="snacks">Snacks</button>
          <button class="pill" data-category="desserts">Desserts & Coffee</button>
        </div>
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="menu-search" placeholder="Search biryani, pizza, momos...">
        </div>
      </div>

      <div class="grid" id="menu-grid"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">&copy; 2026 BiteBox. All rights reserved.</div>
    </div>
  </footer>

  <script src="js/scripts.js"></script>
</body>
</html>
