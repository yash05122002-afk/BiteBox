<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | BiteBox</title>
  <link rel="icon" type="image/png" sizes="32x32" href="css/image/favicon/favicon-32x32.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand"><i class="fa-solid fa-burger" style="color: var(--primary);"></i> Bite<span>Box</span></a>
      <a href="index.html" class="btn btn-outline btn-sm"><i class="fa-solid fa-arrow-left"></i> Home</a>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <h1>Welcome Back</h1>
      <p>Sign in to reorder your favorite meals faster.</p>
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="input-wrap">
            <input type="password" id="login-password" placeholder="Enter your password" required>
            <button type="button" class="toggle-pass" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <p class="auth-footer">New to BiteBox? <a href="signup.html">Create an account</a></p>
    </div>
  </main>

  <script src="js/scripts.js"></script>
</body>
</html>
