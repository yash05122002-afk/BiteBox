<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | BiteBox</title>
  <link rel="icon" type="image/png" sizes="32x32" href="css/image/favicon/favicon-32x32.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand"><i class="fa-solid fa-burger" style="color: var(--primary);"></i> Bite<span>Box</span></a>
      <a href="index.html" class="btn btn-outline btn-sm"><i class="fa-solid fa-arrow-left"></i> Home</a>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <h1>Create Account</h1>
      <p>Join BiteBox for exclusive deals and faster checkout.</p>
      <form id="signup-form">
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
          <label for="signup-email">Email Address</label>
          <input type="email" id="signup-email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <div class="input-wrap">
            <input type="password" id="signup-password" placeholder="Min 6 characters" required>
            <button type="button" class="toggle-pass" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
          </div>
        </div>
        <div class="form-group">
          <label for="signup-confirm">Confirm Password</label>
          <div class="input-wrap">
            <input type="password" id="signup-confirm" placeholder="Re-enter password" required>
            <button type="button" class="toggle-pass" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>
      <p class="auth-footer">Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </main>

  <script src="js/scripts.js"></script>
</body>
</html>
